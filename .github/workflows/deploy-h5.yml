name: 悟 H5 发布

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.env.production'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/offline-shell.mjs'
      - 'wrangler.jsonc'
  workflow_dispatch:

concurrency:
  group: book-h5-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_TURNSTILE_PAGE: ${{ vars.VITE_APP_TURNSTILE_PAGE }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 安装锁定依赖
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=registry.npmmirror.com
      - run: npm run type-check
      - run: npm run build:h5
      - name: 部署到 Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::请先配置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID 仓库 Secrets。'
            exit 1
          fi
          npx --yes wrangler@4.155.0 deploy --config wrangler.jsonc
